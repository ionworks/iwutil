[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iwutil"
version = "0.6.0"
description = "Public utility functions for Ionworks code."
authors = [{ name = "Ionworks Technologies Inc", email = "info@ionworks.com" }]
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.5",
    # Extras get their own unversioned line: Dependabot only versions the plain name.
    "pandas[parquet,feather]",
    # Not 2.5: it needs Python 3.12, and requires-python still allows 3.11.
    "numpy>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1", "pytest-cov>=7.0"
]
docs = [
    "sphinx_rtd_theme",
    "sphinx",
    "myst-parser",
]
polars = [
    "polars>=2.1.0",
]

[tool.hatch.build.targets.sdist]
only-include = ["iwutil", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore:.*is deprecated and will receive no further releases:FutureWarning"]

[project.urls]
Homepage = "https://ionworks.com"
Documentation = "https://docs.ionworks.com"
Repository = "https://github.com/ionworks/ionworks"
