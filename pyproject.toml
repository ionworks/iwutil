[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iwutil"
version = "0.5.5"
description = "Public utility functions for Ionworks code."
authors = [{ name = "Ionworks Technologies Inc", email = "info@ionworks.com" }]
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.5",
    # Extras get their own unversioned line: Dependabot only versions the plain name.
    "pandas[parquet,feather]",
    "numpy>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1", "pytest-cov>=7.0"
]
docs = [
    "sphinx_rtd_theme",
    "sphinx",
    "myst-parser",
]
polars = [
    "polars>=1.44.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[project.urls]
Homepage = "https://ionworks.com"
Documentation = "https://docs.ionworks.com"
Repository = "https://github.com/ionworks/iwutil"
